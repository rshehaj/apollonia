[project]
name = "apollonia"
version = "0.1.0"
description = "Open-source AI tutor for the Albanian Matura exam with grounded, cited answers."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.142",
    "httpx>=0.28",
    "pgvector>=0.5",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
    "sqlalchemy>=2.1",
    "typer>=0.27",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=6.1",
    "torch>=2.14",
]

[project.scripts]
apollonia = "apollonia.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "ruff>=0.16",
    "testcontainers[postgres]>=4.15",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apollonia"]

# CPU-only PyTorch wheels: the default index ships multi-GB CUDA builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Albanian text legitimately contains characters such as "ë", "ç" and en dashes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["apollonia", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not slow"]
markers = [
    "integration: requires Docker (PostgreSQL via testcontainers)",
    "slow: loads the real embedding model",
]
