services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: apollonia
      POSTGRES_PASSWORD: apollonia
      POSTGRES_DB: apollonia
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollonia -d apollonia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
