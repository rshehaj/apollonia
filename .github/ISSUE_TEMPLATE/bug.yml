name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command or request, and the actual output or error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0 or a commit SHA"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Docker version, embedder (bge-m3 or fake).
